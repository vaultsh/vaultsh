[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vaultsh"
version = "0.4.5"
description = "A privacy-focused terminal wallet with encrypted vaults, offline Bitcoin derivation, and opt-in read-only balance lookup."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["cryptocurrency", "wallet", "cli", "privacy", "self-custody"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Utilities",
]
dependencies = [
  "rich>=13.9,<15",
  "typer>=0.12,<1",
  "cryptography>=44,<47",
  "embit>=0.8.0,<0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
vaultsh = "vaultsh.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultsh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
