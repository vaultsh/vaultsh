[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vaultsh"
version = "1.0.0b1"
description = "A beta self-custody multi-chain wallet with an encrypted vault, QR addresses, and explicit-confirmation transfers for Bitcoin, Ethereum, Solana, and local Monero wallet RPC."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["cryptocurrency", "wallet", "cli", "privacy", "self-custody"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Utilities",
]
dependencies = [
  "rich>=13.9,<15",
  "textual>=8.2,<9",
  "typer>=0.12,<1",
  "cryptography>=44,<47",
  "embit>=0.8.0,<0.9",
  "eth-utils>=5.3,<6",
  "eth-hash[pycryptodome]>=0.7,<1",
  "eth-account>=0.13.7,<1",
  "bip-utils>=2.9.3,<3",
  "solders>=0.27,<1",
  "qrcode[pil]>=8,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
vaultsh = "vaultsh.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultsh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
